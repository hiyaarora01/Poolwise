<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POOLWISE Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#f8fafc}
    header{height:64px;padding:10px 20px;background:linear-gradient(120deg,#1e40af,#0369a1);color:white;display:flex;align-items:center;gap:14px}
    .brand{font-size:20px;font-weight:800;color:#bfdbfe}.heading{font-size:14px;font-weight:700}.sub{font-size:12px;color:#dbeafe;margin-top:4px}
    #map{height:calc(100% - 64px);width:100%}
    .error{padding:20px;color:#991b1b;background:#fee2e2}
    .driver-location-marker{width:52px;height:52px;border:4px solid #fff;border-radius:50%;
      background:#ff5a00;box-shadow:0 0 0 4px rgba(255,90,0,.28),0 4px 14px rgba(15,23,42,.55);
      display:flex;align-items:center;justify-content:center}
    .driver-location-marker span{font-size:25px;line-height:1;font-weight:900;color:#fff}
    .route-arrow-icon{background:transparent;border:0}
    .route-arrow-icon svg{width:38px;height:38px;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}

    /* ── Loading / error states ───────────────────────────────── */
    #status-overlay{
      position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(248,250,252,.92);z-index:9999;
      font-family:Arial,sans-serif;gap:16px
    }
    #status-overlay.hidden{display:none}
    .spinner{
      width:48px;height:48px;border:5px solid #bfdbfe;
      border-top-color:#1d4ed8;border-radius:50%;
      animation:spin .9s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .status-msg{font-size:15px;color:#1e40af;font-weight:600}
    .status-err{font-size:14px;color:#991b1b;background:#fee2e2;
      padding:14px 20px;border-radius:8px;max-width:420px;text-align:center;
      border:1px solid #fca5a5}
    .retry-btn{
      padding:8px 20px;background:#1d4ed8;color:#fff;border:none;
      border-radius:6px;cursor:pointer;font-size:14px;font-weight:600
    }
    .retry-btn:hover{background:#1e40af}
  </style>
</head>
<body>
  <header>
    <div class="brand">POOLWISE</div>
    <div>
      <div class="heading" id="heading">Map &amp; Route Viewer</div>
      <div class="sub" id="subtitle">Loading map data…</div>
    </div>
  </header>

  <!-- Loading / error overlay — hidden once data arrives -->
  <div id="status-overlay">
    <div class="spinner" id="spinner"></div>
    <p class="status-msg" id="status-msg">Fetching map data from server…</p>
    <!-- Error card — only shown on failure -->
    <div class="status-err" id="error-card" style="display:none"></div>
    <button class="retry-btn" id="retry-btn" style="display:none" onclick="initMapFromApi()">
      Retry
    </button>
  </div>

  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // POOLWISE Map Viewer — hybrid data loading strategy:
    //
    // SOURCE PRIORITY (checked in order):
    //   1. ?data= URL parameter  — set by the desktop app's MapGenerator.java.
    //      This carries the real, live driver/passenger coordinates from the
    //      running Poolwise application. When present it is used immediately,
    //      no network request is made.
    //   2. Render API fetch      — fallback when the page is opened standalone
    //      (e.g. direct link, demo mode). Calls GET /api/map-data on Render.
    //
    // CONFIGURATION
    //   Set MAP_API_BASE to your Render service URL before deploying to Vercel:
    //     e.g. "https://poolwise-map-api.onrender.com"
    // ─────────────────────────────────────────────────────────────────────────

    const MAP_API_BASE = "https://poolwise.onrender.com";
    const API_ENDPOINT = MAP_API_BASE + "/api/map-data";

    // ── UI helpers ───────────────────────────────────────────────

    function showOverlay(message) {
      document.getElementById("status-overlay").classList.remove("hidden");
      document.getElementById("spinner").style.display    = "block";
      document.getElementById("status-msg").textContent   = message;
      document.getElementById("error-card").style.display = "none";
      document.getElementById("retry-btn").style.display  = "none";
    }

    function showError(message) {
      document.getElementById("spinner").style.display    = "none";
      document.getElementById("status-msg").textContent   = "";
      document.getElementById("error-card").textContent   = message;
      document.getElementById("error-card").style.display = "block";
      document.getElementById("retry-btn").style.display  = "block";
    }

    function hideOverlay() {
      document.getElementById("status-overlay").classList.add("hidden");
    }

    // ── Source 1: URL param (desktop app MapGenerator.java) ──────

    /**
     * Tries to read the map payload from the ?data= URL parameter.
     * MapGenerator.java encodes the full JSON payload (title, subtitle,
     * center, zoom, points, route) as a URL-encoded string in this param.
     * Returns the parsed object, or null if the param is absent/invalid.
     */
    function tryLoadFromUrlParam() {
      try {
        const raw = new URLSearchParams(location.search).get("data");
        if (!raw) return null;
        const payload = JSON.parse(raw);
        validatePayload(payload);
        return payload;
      } catch (e) {
        console.warn("?data= param present but invalid, falling back to API:", e.message);
        return null;
      }
    }

    // ── Source 2: Render API fetch (standalone / demo mode) ──────

    /**
     * Fetches map data from the Java/Render backend.
     * Used when no ?data= param is present (e.g. direct URL, demo).
     * Exposed globally so the "Retry" button can call it.
     */
    async function initMapFromApi() {
      showOverlay("Fetching map data from server…");

      try {
        const response = await fetch(API_ENDPOINT, {
          method:  "GET",
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) {
          throw new Error(
            `Server returned ${response.status} ${response.statusText}. ` +
            `Check that your Render service is running.`
          );
        }

        const payload = await response.json();
        validatePayload(payload);
        renderMap(payload);
        hideOverlay();

      } catch (err) {
        console.error("POOLWISE map fetch failed:", err);
        showError(
          "⚠️ Could not load map data.\n\n" +
          (err.message || String(err)) +
          "\n\nMake sure the Render backend is live and MAP_API_BASE is correct."
        );
      }
    }

    /**
     * Validates the JSON structure returned by the API.
     * Throws a descriptive Error if required fields are missing.
     */
    function validatePayload(p) {
      if (!p || typeof p !== "object")
        throw new Error("API response is not a JSON object.");
      if (typeof p.title !== "string")
        throw new Error("Missing field: 'title'");
      if (!Array.isArray(p.points))
        throw new Error("Missing field: 'points' (expected array)");
      if (!Array.isArray(p.route))
        throw new Error("Missing field: 'route' (expected array)");
    }

    // ── Map rendering ─────────────────────────────────────────────

    function renderMap(payload) {
      document.getElementById("heading").textContent  = payload.title    || "Map & Route Viewer";
      document.getElementById("subtitle").textContent = payload.subtitle || "OpenStreetMap · Leaflet";

      const fallbackCenter = [28.6280, 77.2090];
      const center = Array.isArray(payload.center) && payload.center.length === 2
        ? payload.center
        : fallbackCenter;

      const map = L.map("map").setView(center, Number(payload.zoom) || 12);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      const points = Array.isArray(payload.points) ? payload.points : [];
      const driverIcon = L.divIcon({
        className: "",
        html: '<div class="driver-location-marker"><span>🚗</span></div>',
        iconSize: [52, 52],
        iconAnchor: [26, 26],
        popupAnchor: [0, -28]
      });

      points.forEach(p => {
        if (!Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lon))) return;
        const pointTitle    = String(p.title || "").toLowerCase();
        const isDriverStart = pointTitle.includes("start") || pointTitle.includes("driver");
        const marker = L.marker([Number(p.lat), Number(p.lon)], {
          icon:  isDriverStart ? driverIcon : new L.Icon.Default(),
          title: String(p.title || "")
        }).addTo(map);
        if (p.title || p.popup) marker.bindPopup(String(p.popup || p.title));
      });

      // Place direction arrows at evenly spaced positions along the route.
      // Interpolated by real distance so even a two-point fallback route
      // gets three distinct arrows instead of stacking at the same midpoint.
      function addRouteDirectionArrows(line) {
        const paths = [];
        function collect(layer) {
          if (layer && typeof layer.getLatLngs === "function") {
            const flatten = value => {
              const out = [];
              (function walk(v) {
                if (Array.isArray(v)) v.forEach(walk);
                else if (v && Number.isFinite(v.lat) && Number.isFinite(v.lng)) out.push(v);
              })(value);
              return out;
            };
            const pts = flatten(layer.getLatLngs());
            if (pts.length > 1) paths.push(pts);
          } else if (layer && typeof layer.eachLayer === "function") {
            layer.eachLayer(collect);
          }
        }
        collect(line);
        paths.forEach(pts => {
          const lengths = [];
          let total = 0;
          for (let i = 0; i < pts.length - 1; i++) {
            const length = map.distance(pts[i], pts[i + 1]);
            lengths.push(length);
            total += length;
          }
          if (!total) return;
          [0.2, 0.5, 0.8].forEach(fraction => {
            const target = total * fraction;
            let travelled = 0;
            for (let i = 0; i < lengths.length; i++) {
              const segLen = lengths[i];
              if (travelled + segLen >= target || i === lengths.length - 1) {
                const a = pts[i], b = pts[i + 1];
                const t = segLen ? Math.max(0, Math.min(1, (target - travelled) / segLen)) : 0.5;
                const lat = a.lat + (b.lat - a.lat) * t;
                const lng = a.lng + (b.lng - a.lng) * t;
                const pa = map.latLngToLayerPoint(a);
                const pb = map.latLngToLayerPoint(b);
                const bearing = Math.atan2(pb.x - pa.x, -(pb.y - pa.y)) * 180 / Math.PI;
                const icon = L.divIcon({
                  className: "route-arrow-icon",
                  html: '<svg viewBox="0 0 36 36" aria-hidden="true" style="transform:rotate(' + bearing + 'deg);transform-origin:50% 50%"><path d="M18 2 L33 32 L18 24 L3 32 Z" fill="#ffdf00" stroke="#111827" stroke-width="3" stroke-linejoin="round"/></svg>',
                  iconSize: [38, 38],
                  iconAnchor: [19, 19]
                });
                L.marker([lat, lng], { icon, interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);
                break;
              }
              travelled += segLen;
            }
          });
        });
      }

      const route = Array.isArray(payload.route) ? payload.route : [];
      if (route.length >= 2) {
        const coords = route.map(p => [Number(p[1]), Number(p[0])]);
        fetch(
          "https://router.project-osrm.org/route/v1/driving/" +
          route.map(p => Number(p[0]) + "," + Number(p[1])).join(";") +
          "?overview=full&geometries=geojson"
        )
          .then(r => { if (!r.ok) throw new Error("Routing service unavailable"); return r.json(); })
          .then(d => {
            if (d.code !== "Ok" || !d.routes || !d.routes.length) throw new Error("No road route found");
            const line = L.geoJSON(d.routes[0].geometry, { style: { color: "#2563eb", weight: 5, opacity: .9 } }).addTo(map);
            addRouteDirectionArrows(line);
            map.fitBounds(line.getBounds().pad(.12));
          })
          .catch(() => {
            const line = L.polyline(coords, { color: "#2563eb", weight: 4, dashArray: "8 6" }).addTo(map);
            addRouteDirectionArrows(line);
            map.fitBounds(line.getBounds().pad(.12));
          });
      } else if (points.length) {
        const bounds = L.latLngBounds(points.map(p => [Number(p.lat), Number(p.lon)]));
        if (bounds.isValid()) map.fitBounds(bounds.pad(.15));
      }
    }

    // ── Boot ─────────────────────────────────────────────────────
    // Try the URL param first (desktop app passes real data here).
    // Fall back to the Render API fetch when the page is opened standalone.
    (function boot() {
      const urlPayload = tryLoadFromUrlParam();
      if (urlPayload) {
        // Real data from MapGenerator.java — render immediately, no fetch needed.
        hideOverlay();
        renderMap(urlPayload);
      } else {
        // No URL param — fetch from the Render backend (demo / standalone mode).
        initMapFromApi();
      }
    })();
  </script>
</body>
</html>
